<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Continue</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%; width:100%;
  background:#080612;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(80,40,180,.5) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 5%,  rgba(0,180,80,.18) 0%, transparent 65%),
    radial-gradient(ellipse 70% 60% at 50% 95%, rgba(120,30,160,.35) 0%, transparent 70%),
    linear-gradient(160deg,#0e0820 0%,#080612 50%,#080f14 100%);
}

.card {
  width:calc(100% - 40px);
  max-width:380px;
  background:rgba(22,16,40,.85);
  backdrop-filter:blur(24px);
  border:1px solid rgba(120,80,255,.2);
  border-radius:24px;
  padding:40px 28px 36px;
  text-align:center;
  box-shadow:0 0 80px rgba(80,40,200,.2), inset 0 1px 0 rgba(255,255,255,.06);
}

/* shield / lock icon */
.icon-wrap {
  width:72px; height:72px;
  background:linear-gradient(135deg,rgba(255,140,0,.15),rgba(255,80,0,.1));
  border:1.5px solid rgba(255,140,0,.35);
  border-radius:20px;
  margin:0 auto 24px;
  display:flex; align-items:center; justify-content:center;
  font-size:36px;
}

.eyebrow {
  font-size:11px; letter-spacing:2.5px;
  color:rgba(255,255,255,.35);
  text-transform:uppercase;
  margin-bottom:12px;
}

.headline {
  font-size:26px; font-weight:800;
  color:#fff;
  line-height:1.2;
  margin-bottom:10px;
}

.sub {
  font-size:15px; color:rgba(255,255,255,.45);
  line-height:1.6;
  margin-bottom:32px;
}
.sub strong { color:rgba(255,200,80,.8); }

/* buton portocaliu */
.btn-continue {
  display:block; width:100%;
  background:linear-gradient(135deg,#ff9500,#ff5f00);
  color:#fff;
  font-size:18px; font-weight:800;
  padding:20px;
  border-radius:16px; border:none; cursor:pointer;
  box-shadow:0 8px 32px rgba(255,120,0,.4);
  letter-spacing:.3px;
  -webkit-appearance:none;
  transition:filter .1s;
}
.btn-continue:active { filter:brightness(.88); }

.note {
  margin-top:16px;
  font-size:12px;
  color:rgba(255,255,255,.2);
}

/* pulsating dot */
.live-dot {
  display:inline-block;
  width:7px; height:7px;
  background:#ff9500;
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
  animation:blink 1.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">🔓</div>
  <div class="headline">You've been selected!</div>
  <button class="btn-continue" id="continueBtn">Continue in Browser →</button>
</div>

<script>
(function(){
  // preia ?s1= din URL si il paseaza mai departe
  var params = new URLSearchParams(window.location.search);
  var s1 = params.get('s1');
  var dest = 'cashapp750.html';
  if(s1) dest += '?s1=' + encodeURIComponent(s1);

  document.getElementById('continueBtn').addEventListener('click', function(){
    window.location.href = dest;
  });
})();
</script>

</body>
</html>
